<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MediaHub Photo Sync</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #fafafa;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f4510b, #e11d48);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fafafa;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #3f3f46;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    button.primary:hover {
      background: #1d4ed8;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #052e16;
      border: 1px solid #14532d;
      color: #86efac;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">M</div>
    <div>
      <h1>MediaHub Photo Sync</h1>
    </div>
  </div>
  <div class="badge">Active & Ready</div>
  <p>Sync official district logos to Instagram accounts directly in Safari or Chrome.</p>
  <button id="open-edit" class="primary">Open Instagram Edit Profile</button>
  <button id="open-mediahub">Open MediaHub Photo Roster</button>
  <script src="popup.js"></script>
</body>
</html>
