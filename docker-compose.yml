# ============================================
# MediaHub — Full Docker Stack
# ============================================
#
# Start:       bash start.sh
# Fresh start: bash start.sh --reset
# Stop:        docker compose down
# Full reset:  docker compose down -v && bash start.sh
#
# URLs:
#   App (HTTPS): https://localhost:3443
#   App (HTTP):  http://localhost:3000
#   Studio:      http://localhost:54323
#   Email:       http://localhost:54324
#
# Works on: Linux, macOS, Windows (Docker Desktop)
# Requirements: Docker only — no Node.js needed on host

services:
  # ─── Database ───
  db:
    image: supabase/postgres:15.6.1.143
    container_name: mediahub-database
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supabase
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d supabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Auth ───
  auth:
    image: supabase/gotrue:v2.151.0
    container_name: mediahub-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/supabase?search_path=auth
      GOTRUE_SITE_URL: https://localhost:3443
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3000/**,https://localhost:3443/**"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@localhost
      GOTRUE_SMTP_HOST: email
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_SMTP_SENDER_NAME: MediaHub
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${MH_GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${MH_GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:54321/auth/v1/callback
    depends_on:
      db:
        condition: service_healthy

  # ─── REST API ───
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: mediahub-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/supabase
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy

  # ─── API Gateway ───
  kong:
    image: kong:2.8.1
    container_name: mediahub-gateway
    restart: unless-stopped
    ports:
      - "54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_PROXY_LARGE_CLIENT_HEADER_BUFFERS: 4 128k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - rest
      - auth

  # ─── Realtime ───
  realtime:
    image: supabase/realtime:v2.28.32
    container_name: mediahub-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: supabase
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      db:
        condition: service_healthy

  # ─── Database Studio ───
  studio:
    image: supabase/studio:20240422-5cf8f30
    container_name: mediahub-studio
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://kong:8000
      SUPABASE_REST_URL: http://kong:8000/rest/v1/
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    depends_on:
      - kong

  # ─── Database Meta ───
  meta:
    image: supabase/postgres-meta:v0.80.0
    container_name: mediahub-meta
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: supabase
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: mediahub-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      # A guardrail only: queue code now removes completed background jobs.
      # noeviction fails a bad producer explicitly instead of silently losing jobs.
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --auto-aof-rewrite-min-size
      - 16mb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Email ───
  email:
    image: inbucket/inbucket:latest
    container_name: mediahub-email
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "54324:9000"
      - "2500:2500"

  # ─── DB Init (runs once on first start, then exits) ───
  db-init:
    image: postgres:15-alpine
    container_name: mediahub-db-init
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: supabase_admin
      PGPASSWORD: postgres
      PGDATABASE: supabase
      SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      ADMIN_EMAIL: admin@mediahub.local
      ADMIN_PASSWORD: admin123
    volumes:
      - ./scripts/docker-init.sh:/init.sh:ro
      - ./src/server/db/schema.sql:/schema.sql:ro
      - ./supabase/migrations:/migrations:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started

  # ─── Next.js App (production build — pre-compiled, fast) ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: mediahub-app
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_ vars are baked in at build time (see Dockerfile).
      # These runtime vars are for server-side code only.
      SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      REDIS_URL: redis://redis:6379
      TOKEN_ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      # The dashboard is interactive; it must not start account-wide polling
      # or scraping while idle. Enable only for an intentionally scheduled run.
      ENABLE_AUTOMATIC_BACKGROUND_JOBS: "false"
      NEXT_PUBLIC_APP_URL: https://localhost:3443
      # Optional rotating proxy for Instagram scraping (from .env). Either name works.
      INSTA_PROXY: ${INSTA_PROXY:-}
      ECOURTS_PROXIES: ${ECOURTS_PROXIES:-}
      # Concurrent Facebook comment pages (1-8). Unset picks a value from the
      # host's CPU and memory; lower it if the machine runs hot.
      FB_COMMENT_WORKERS: ${FB_COMMENT_WORKERS:-}
    volumes:
      - ./public/generated:/app/public/generated
      - ./public/videos:/app/public/videos:ro
      # Thumbnail cache. A named volume, not tmpfs and not the container layer:
      # a restart otherwise throws away every generated poster, and regenerating
      # one costs a full Drive round-trip (~1.3s) per media tile.
      - media-cache:/var/cache/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kong:
        condition: service_started

  # ─── BullMQ Worker ───
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: mediahub-worker
    # Manual background work only. It cannot start when the regular dashboard
    # stack is started; use --profile background for an intentional worker run.
    profiles: ["background"]
    restart: unless-stopped
    # Render jobs decode whole images/videos into memory. Without a ceiling an
    # OOM kills the process, which takes down all 12 workers at once — and a
    # publish job killed after creating an Instagram container but before
    # recording platform_post_id re-posts on retry (x75 accounts). Cap the heap
    # below the container limit so V8 GCs instead of the kernel OOM-killing us.
    mem_limit: 2g
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
      # Minimum gap between Instagram container creations. Default is 30000.
      # Lowered to 10s after measuring x-app-usage at 0% call_volume during a
      # live reel run. REELS ONLY: photos create containers instantly and burst
      # far harder, which is what tripped "Application request limit reached"
      # before. Raise this back toward 30000 for a photo fan-out.
      IG_PUBLISH_MIN_GAP_MS: "1000"
      # Scratch space for ffmpeg render intermediates (see render-tmp volume).
      RENDER_TMP_DIR: /tmp/render
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      REDIS_URL: redis://redis:6379
      TOKEN_ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      ENABLE_AUTOMATIC_BACKGROUND_JOBS: "false"
      NEXT_PUBLIC_APP_URL: https://localhost:3443
      # Optional rotating proxy for Instagram scraping (from .env). Either name works.
      INSTA_PROXY: ${INSTA_PROXY:-}
      ECOURTS_PROXIES: ${ECOURTS_PROXIES:-}
    # A real volume, not tmpfs: video renders stream through here and tmpfs
    # would spend the mem_limit above on scratch files.
    volumes:
      - render-tmp:/tmp/render
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kong:
        condition: service_started

  # ─── HTTPS Reverse Proxy ───
  caddy:
    image: caddy:2-alpine
    container_name: mediahub-caddy
    restart: unless-stopped
    ports:
      - "3443:3443"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  media-cache:
  redis-data:
  caddy-data:
  caddy-config:
  render-tmp:
